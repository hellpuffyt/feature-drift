name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: pytest
        run: pytest -q

  quality:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: ruff
        run: ruff check .

      - name: mypy (strict)
        run: mypy

      - name: coverage floor
        run: pytest -q --cov --cov-fail-under=95

  audit-the-example:
    name: measure drift on the bundled example end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: install
        run: python -m pip install --upgrade pip && pip install -e .

      # The example deliberately shifts amount/channel/latency and leaves
      # country untouched. Exit codes and the untouched feature's verdict
      # are asserted exactly, not just "ran without crashing".
      - name: exit codes and verdicts are exactly as documented
        run: |
          set -euo pipefail
          set +e
          feature-drift examples/train.csv examples/serving.csv > /dev/null
          gate=$?
          set -e
          test "$gate" = "3"
          feature-drift examples/train.csv examples/serving.csv --fail-on never \
            --format json | python -c "
          import json, sys
          payload = json.load(sys.stdin)
          by_name = {f['feature']: f for f in payload['features']}
          assert by_name['country']['verdict'] == 'stable', by_name['country']
          assert by_name['channel']['unseen_categories'] == ['partner'], by_name['channel']
          assert payload['summary']['severe'] >= 1, payload['summary']
          print('example drift report is exactly as documented')
          "

      - name: zero runtime dependencies
        run: |
          set -euo pipefail
          python - <<'EOF'
          import tomllib
          with open("pyproject.toml", "rb") as fh:
              deps = tomllib.load(fh)["project"]["dependencies"]
          assert deps == [], f"runtime dependencies declared: {deps}"
          print("dependencies = [] holds")
          EOF
