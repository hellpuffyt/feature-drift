[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "feature-drift"
version = "0.1.0"
description = "Detect feature drift between training and serving data and report which features moved and by how much."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Prabesh Sharma" }]
keywords = ["drift", "psi", "monitoring", "ml", "data-quality", "serving"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.6", "mypy>=1.8"]

[project.scripts]
feature-drift = "feature_drift.cli:main"

[project.urls]
Homepage = "https://github.com/hellpuffyt/feature-drift"
Issues = "https://github.com/hellpuffyt/feature-drift/issues"
Changelog = "https://github.com/hellpuffyt/feature-drift/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/feature_drift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 95
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[tool.coverage.run]
source = ["feature_drift"]

[tool.coverage.report]
show_missing = true
